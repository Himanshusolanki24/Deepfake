# AUTHENTIQ — Supabase local development configuration.
# Generated with `supabase init`-style structure. Run `supabase start` to use.

project_id = "authentiq"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[storage.buckets.media]
public = false
file_size_limit = "200MiB"

[storage.buckets.evidence]
public = false
file_size_limit = "500MiB"

[storage.buckets.reports]
public = false
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

# Optional social providers — enabled later per project. Do NOT hardcode the app
# around email/password only.
# [auth.external.google]
# enabled = true
# client_id = ""
# secret = ""
# redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

# [auth.external.github]
# enabled = true
# client_id = ""
# secret = ""

# [auth.external.microsoft]
# enabled = true
# client_id = ""
# secret = ""

[analytics]
enabled = true
port = 54327